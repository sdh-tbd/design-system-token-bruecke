name: Build design tokens

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tokens-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    name: tokens / build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Figma token export
        run: pnpm validate

      - name: Run tests
        run: pnpm test

      - name: Build CSS and TypeScript
        run: pnpm build

      - name: Package generated outputs
        run: pnpm pack --pack-destination artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: design-tokens-${{ github.sha }}
          path: artifacts/*.tgz
          retention-days: 14
