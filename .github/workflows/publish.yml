name: Publish design tokens

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: package / publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@sdh-tbd"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and package version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(node --input-type=module -e \
            "import packageJson from './package.json' with { type: 'json' }; process.stdout.write(packageJson.version)")"
          test "$TAG_VERSION" = "v$package_version"

      - name: Validate and build package
        run: pnpm validate && pnpm test && pnpm build

      - name: Publish to GitHub Packages
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
