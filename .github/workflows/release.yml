name: Release design tokens

on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - "package.json"

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: tokens-release
  cancel-in-progress: false

jobs:
  release:
    name: tokens / release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@sdh-tbd"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create version PR or publish package
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore: release design tokens"
          pr-title: "chore: release design tokens"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
